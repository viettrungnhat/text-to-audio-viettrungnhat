<svg width="1400" height="840" viewBox="0 0 1400 840" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1400" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#E2E8F0" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1400" height="840" rx="44" fill="url(#bg3)"/>
  <circle cx="250" cy="150" r="180" fill="#F59E0B" fill-opacity="0.16"/>
  <circle cx="1180" cy="150" r="170" fill="#EC4899" fill-opacity="0.14"/>
  <circle cx="1120" cy="700" r="220" fill="#22C55E" fill-opacity="0.10"/>
  <text x="120" y="128" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial" font-size="34" font-weight="700">Quản lý API key, Discord và AWS</text>
  <text x="120" y="166" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="18">Mô phỏng khu vực cài đặt để lưu, kiểm tra và cập nhật kết nối dịch vụ.</text>

  <g filter="url(#shadow3)">
    <rect x="110" y="210" width="1180" height="520" rx="34" fill="url(#glass)"/>
  </g>
  <rect x="150" y="252" width="480" height="76" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="180" y="286" fill="#0F172A" font-family="Inter, Segoe UI, Arial" font-size="20" font-weight="700">GitHub Models / Gemini / Google TTS</text>
  <text x="180" y="312" fill="#475569" font-family="Inter, Segoe UI, Arial" font-size="16">Lưu token và kiểm tra key ngay trong app</text>

  <rect x="670" y="252" width="530" height="76" rx="20" fill="#0F172A"/>
  <text x="700" y="286" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial" font-size="20" font-weight="700">Discord Webhook</text>
  <text x="700" y="312" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial" font-size="16">Gửi thông báo tự động cho lớp / giáo viên</text>

  <rect x="150" y="350" width="1050" height="70" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="180" y="392" fill="#0F172A" font-family="Inter, Segoe UI, Arial" font-size="20" font-weight="700">AWS / Email / App Password</text>
  <rect x="960" y="368" width="210" height="34" rx="12" fill="url(#orange)"/>
  <text x="1010" y="391" fill="white" font-family="Inter, Segoe UI, Arial" font-size="16" font-weight="700">Kiểm tra kết nối</text>

  <rect x="150" y="448" width="330" height="220" rx="24" fill="#0F172A" stroke="#334155"/>
  <text x="180" y="490" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="700">Cảnh báo</text>
  <text x="180" y="530" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial" font-size="18">App báo ngay khi key sai, hết quota hoặc webhook lỗi.</text>
  <rect x="180" y="580" width="250" height="34" rx="12" fill="#1F2937" stroke="#475569"/>
  <text x="232" y="603" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="16" font-weight="700">Mở phần cài đặt</text>

  <rect x="510" y="448" width="690" height="220" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="540" y="490" fill="#0F172A" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="700">Tình trạng kết nối</text>
  <rect x="540" y="530" width="610" height="18" rx="9" fill="#DBEAFE"/>
  <rect x="540" y="530" width="430" height="18" rx="9" fill="#38BDF8"/>
  <rect x="540" y="566" width="610" height="18" rx="9" fill="#DCFCE7"/>
  <rect x="540" y="566" width="520" height="18" rx="9" fill="#22C55E"/>
  <rect x="540" y="602" width="610" height="18" rx="9" fill="#FDE68A"/>
  <rect x="540" y="602" width="290" height="18" rx="9" fill="#F59E0B"/>
</svg>
